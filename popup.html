<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    .api-key-section {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .api-key-section label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
    }
    .api-key-section input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    .api-key-section button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: none;
      border-radius: 4px;
      background: #4285f4;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }
    .api-key-section button:hover {
      background: #3367d6;
    }
    .language-section {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .language-section label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #666;
    }
    .language-section select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
      background: white;
    }
    .capture-section {
      text-align: center;
    }
    .capture-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #34a853;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .capture-btn:hover {
      background: #2d8f47;
    }
    .capture-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .shortcut-hint {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
    }
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }
    .status.success {
      background: #e8f5e8;
      color: #2e7d32;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
    }
    .result-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }
    .result-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }
    .result-close {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #666;
    }
    .result-text {
      margin-top: 20px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 G-Context</h1>
  </div>

  <div class="api-key-section">
    <label for="apiKey">Google Gemini API Key:</label>
    <input type="password" id="apiKey" placeholder="Enter your API key...">
    <button id="saveApiKey">Save API Key</button>
  </div>

  <div class="language-section">
    <label for="targetLanguage">Target Language (optional):</label>
    <select id="targetLanguage">
      <option value="">Auto-detect & extract only</option>
      <option value="english">English</option>
      <option value="chinese">Chinese (中文)</option>
      <option value="spanish">Spanish (Español)</option>
      <option value="french">French (Français)</option>
      <option value="german">German (Deutsch)</option>
      <option value="japanese">Japanese (日本語)</option>
      <option value="korean">Korean (한국어)</option>
      <option value="russian">Russian (Русский)</option>
      <option value="portuguese">Portuguese (Português)</option>
      <option value="italian">Italian (Italiano)</option>
      <option value="arabic">Arabic (العربية)</option>
      <option value="hindi">Hindi (हिन्दी)</option>
      <option value="dutch">Dutch (Nederlands)</option>
      <option value="swedish">Swedish (Svenska)</option>
      <option value="norwegian">Norwegian (Norsk)</option>
      <option value="danish">Danish (Dansk)</option>
      <option value="finnish">Finnish (Suomi)</option>
      <option value="polish">Polish (Polski)</option>
      <option value="turkish">Turkish (Türkçe)</option>
      <option value="thai">Thai (ไทย)</option>
      <option value="vietnamese">Vietnamese (Tiếng Việt)</option>
    </select>
  </div>

  <div class="capture-section">
    <button id="captureBtn" class="capture-btn" disabled>
      📸 Capture Screenshot
    </button>
    <div class="shortcut-hint">
      💡 Tip: Use Ctrl+Shift+G (Cmd+Shift+G on Mac) for quick capture
    </div>
  </div>

  <div id="status" class="status" style="display: none;"></div>

  <script src="popup.js"></script>
</body>
</html>
